openapi: 3.0.3
info:
  title: MessInsight API Specification
  description: API contract for the Smart Mess and Canteen Feedback System with Demand Prediction.
  version: 1.0.0
servers:
  - url: /api
    description: Next.js API Gateway

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: messinsight_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StandardSuccess:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation successful
        data:
          type: object
        meta:
          type: object
          additionalProperties: true

    StandardError:
      type: object
      required:
        - success
        - message
        - error
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Detailed failure message
        error:
          type: object
          required:
            - code
            - correlationId
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            details:
              type: object
            correlationId:
              type: string
              example: c9bf9e57-1685-4c89-bafb-ff5af830be8a

    MealType:
      type: string
      enum: [BREAKFAST, LUNCH, SNACKS, DINNER]

    UserRole:
      type: string
      enum: [STUDENT, MANAGER, ADMIN]

    RatingInteger:
      type: integer
      minimum: 1
      maximum: 5

    UnitEnum:
      type: string
      enum: [kg, g, l, ml, count]

    ComplaintCategory:
      type: string
      enum: [FOOD_HYGIENE, WATER_QUALITY, CONTAMINATION, CLEANLINESS, FOOD_STORAGE, OTHER]

    ComplaintPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]

    ComplaintStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, REJECTED]

    SentimentLabel:
      type: string
      enum: [POSITIVE, NEUTRAL, NEGATIVE, MIXED, UNCERTAIN]

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardSuccess'

  /auth/register:
    post:
      summary: Register a student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, instituteEmail, password]
              properties:
                name: { type: string }
                instituteEmail: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Registered successfully, OTP dispatched
        '202':
          description: Registered, but email dispatch failed (retryable)
        '409':
          description: Email already registered
        '422':
          description: Validation error or non-institute domain

  /auth/login:
    post:
      summary: Authenticate user and issue HttpOnly session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instituteEmail, password]
              properties:
                instituteEmail: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in successfully
        '401':
          description: Invalid email or password
        '403':
          description: Account blocked or unverified
        '429':
          description: Throttled due to repeated failures

  /auth/logout:
    post:
      summary: Revoke session and clear cookie
      responses:
        '200':
          description: Session invalidated

  /auth/verify-email:
    post:
      summary: Verify student email with 6-digit OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instituteEmail, otp]
              properties:
                instituteEmail: { type: string }
                otp: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Verified
        '400':
          description: Invalid OTP or max attempts reached
        '410':
          description: OTP expired

  /auth/resend-otp:
    post:
      summary: Request new verification OTP
      responses:
        '200':
          description: OTP resent
        '429':
          description: Cooldown active or hourly limit reached

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthenticated

  /menu/today:
    get:
      summary: View today's published meals
      responses:
        '200':
          description: Today's published menu
        '404':
          description: Menu not published yet

  /menu/weekly:
    get:
      summary: View 7-day weekly menu
      responses:
        '200':
          description: Weekly meals

  /manager/menu:
    post:
      summary: Create menu draft
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Created
        '409':
          description: Duplicate menu for meal and date
    get:
      summary: List menus for manager mess
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Menus list

  /manager/menu/publish:
    post:
      summary: Publish menu to students
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Published
        '422':
          description: Cannot publish empty menu

  /student/feedback:
    post:
      summary: Submit feedback for a served meal
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Feedback received
        '409':
          description: Duplicate feedback for this menu
    get:
      summary: View student's feedback history
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: History list

  /student/complaints:
    post:
      summary: Lodge a hygiene/quality complaint
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Complaint lodged

  /manager/attendance:
    post:
      summary: Record actual meal attendance
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Attendance recorded
        '409':
          description: Attendance already logged

  /manager/waste:
    post:
      summary: Record meal waste and leftover quantities
      security: [{ cookieAuth: [] }]
      responses:
        '201':
          description: Waste log recorded

  /manager/predictions/generate:
    post:
      summary: Trigger demand and attendance prediction
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Generated prediction

  /reports/daily:
    get:
      summary: Daily mess operational report
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Report data or CSV download

  /admin/users:
    get:
      summary: Manage university users
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Paginated user directory

